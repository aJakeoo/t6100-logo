name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate config.js from secrets
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          RESULTS_ACCESS_TOKEN: ${{ secrets.RESULTS_ACCESS_TOKEN }}
        run: |
          sed \
            -e "s#__APPS_SCRIPT_URL__#${APPS_SCRIPT_URL}#" \
            -e "s#__RESULTS_ACCESS_TOKEN__#${RESULTS_ACCESS_TOKEN}#" \
            config.template.js > config.js

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
